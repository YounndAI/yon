document: Deployment Pipeline Policy
sections:
  - name: Build Stage
    rules:
      - id: build-artifacts
        level: MUST
        when: build completes
        then: publish artifacts to artifact registry with SHA-256 checksum
      - id: build-notify
        level: SHOULD
        when: build fails
        then: notify the on-call channel within 60 seconds
  - name: Test Stage
    rules:
      - id: test-artifacts
        level: MUST
        when: running integration tests
        then: pull artifacts from registry using checksums from Build Stage — never rebuild
      - id: test-coverage
        level: MUST
        when: test stage completes
        then: report coverage to Deploy Stage — deploy gate requires ≥80%
    notes:
      - Test Stage depends on Build Stage artifacts. Deploy Stage depends on Test Stage coverage report.
  - name: Deploy Stage
    rules:
      - id: deploy-gate
        level: MUST
        when: deploying to production
        then: verify Test Stage coverage ≥80% AND Build Stage checksum matches artifact in registry
      - id: deploy-rollback
        level: MUST
        when: deploy health check fails within 5 minutes
        then: automatic rollback to previous Build Stage artifact
    notes:
      - "Deploy Stage has cross-dependencies: requires outputs from BOTH Build Stage and Test Stage."
