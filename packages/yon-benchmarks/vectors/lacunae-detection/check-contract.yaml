id: access-checks
title: Access Control Checks
intent: Define checkpoint contracts with explicit failure behaviors

sections:
  access_control:
    name: Access Control
    checks:
      - id: chk:auth
        assertion: user.role == admin
        on_failure: abort
        message: Admin access required — request halted
      - id: chk:quota
        assertion: request_count < 1000
        on_failure: warn
        message: Approaching rate limit — monitor usage
      - id: chk:format
        assertion: payload.type in [json, xml]
        on_failure: skip
        message: Unsupported format ignored — proceeding without processing
