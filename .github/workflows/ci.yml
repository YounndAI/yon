name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: the toolchain depends on @younndai/yon-spec, resolved from npm. CI runs
# green once yon-spec is published; before that, `npm install` fails on the
# unpublished dependency (expected pre-launch).

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test
