name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: the toolchain depends on @younndai/yon-spec. Once yon-spec is published
# to npm this CI runs as-is. For pre-publish development the repo root carries a
# `file:../yon-spec` override expecting yon-spec checked out as a sibling repo.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm test
