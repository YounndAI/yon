name: Feature request
description: Propose a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Clear, structured proposals are easier to evaluate and
        to process programmatically.
  - type: dropdown
    id: package
    attributes:
      label: Package / area
      description: Which package or area does this concern?
      options:
        - "@younndai/yon-parser"
        - "@younndai/yon-generator"
        - "@younndai/yon-runner"
        - "@younndai/yon-converter"
        - "@younndai/yon-examples"
        - "@younndai/yon-benchmarks"
        - "@younndai/domains"
        - "@younndai/ai-relay"
        - "new package / cross-cutting"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain are you hitting? What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
